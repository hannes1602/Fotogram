<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
</head>

<link rel="stylesheet" href="style.css">
<script src="script.js"></script>

<body>
    <header>
        <div class="header_div">
            <img src="./img/Fotogram_Logo.svg" alt="Fotogram_Logo">
        </div>
        
    </header>

    <main>
        <h1>Your personal photo album</h1>

        <section class="imgs_first_row">
            <img src="./img/1_Bild.jpg" alt="pic_ice">
            <img src="./img/2_Bild.jpg" alt="city_night">
            <img src="./img/3_Bild.jpg" alt="clouds">
            <img src="./img/4_Bild.jpg" alt="bird">
            <img src="./img/5_Bild.jpg" alt="hurricane">
            <img src="./img/6_Bild.jpg" alt="winter_lake">
            <img src="./img/7_Bild.jpg" alt="duck">
        </section>

        <section class="imgs_second_row">
            <img src="./img/8_Bild.jpg" alt="night_man">
            <img src="./img/9_Bild.jpg" alt="bird_stone">
            <img src="./img/10_Bild.jpg" alt="leopard">
            <img src="./img/11_Bild.jpg" alt="mountains">
            <img src="./img/12_Bild.jpg" alt="winter_tree">
        </section>
    </main>

    <footer>
        <div class="footer_div">
            <img src="./img/DA_Logo.svg" alt="DA_Logo">
            <p>© 2023 Developer Akademie GmbH </p>
        </div>
    </footer>
</body>

</html>
