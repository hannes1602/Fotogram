<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
</head>

<link rel="stylesheet" href="style.css">
<script src="script.js"></script>

<body>
    <header>
        <div class="header_div">
            <img src="./img/Fotogram_Logo.svg" alt="Fotogram_Logo">
        </div>

    </header>

    <main>

        <div class="content_section">
            <h1>Your personal photo album</h1>

            <div class="img_section">
                <section class="imgs_first_row">
                    <img src="./img/1_Bild.jpg" alt="Greenland" onclick="openOverlay(0)">
                    <!--Function overlay wird bei Klick ausgeführt. In Klammern steht der Index, um das jeweilige Element des Arrays einzufügen-->
                    <img src="./img/2_Bild.jpg" alt="Tokyo_night" onclick="openOverlay(1)">
                    <img src="./img/3_Bild.jpg" alt="rain_sky" onclick="openOverlay(2)">
                    <img src="./img/4_Bild.jpg" alt="blue_tit" onclick="openOverlay(3)">
                    <img src="./img/5_Bild.jpg" alt="hurricane" onclick="openOverlay(4)">
                    <img src="./img/6_Bild.jpg" alt="Norway" onclick="openOverlay(5)">
                    <img src="./img/7_Bild.jpg" alt="moore_duck" onclick="openOverlay(6)">
                </section>

                <section class="imgs_second_row">
                    <img src="./img/8_Bild.jpg" alt="sea_night" onclick="openOverlay(7)">
                    <img src="./img/9_Bild.jpg" alt="bird_stone" onclick="openOverlay(8)">
                    <img src="./img/10_Bild.jpg" alt="snow_leopard" onclick="openOverlay(9)">
                    <img src="./img/11_Bild.jpg" alt="mountains" onclick="openOverlay(10)">
                    <img src="./img/12_Bild.jpg" alt="winter_wonderland" onclick="openOverlay(11)">
                </section>
            </div>
        </div>

        <div id="overlay" class="overlay d_none">
            <!--id für JS, class für CSS, d_none um es auszublenden wenn die Seite geladen wird-->
            <div class="overlay_content">

                <div class="overlay_top">
                    <h2 id="overlay_Pictitel">Bildname</h2>

                    <button class="close_button" onclick="closeOverlay()"><img src="./img/Close_icon.svg"
                            alt="close_icon"></button>
                </div>

                <img id="overlay_img" src="" alt="OverlayAnsicht">
                <!--Platzhalter, um es mit JS zu verknüpfen und später das angeklickte Bild auszuwählen-->
                <div class="overlay_navigation">
                    <button class="arrow_button" onclick="prevImg()"><img class="arrow_button_left"
                            src="./img/Arrow.svg" alt="arrow_left"></button>
                    <span id="img_counter">1/12</span>
                    <button class="arrow_button" onclick="nextImg()"><img src="./img/Arrow.svg"
                            alt="arrow_right"></button>

                </div>
            </div>

        </div>
    </main>

    <footer>
        <div class="footer_div">
            <img src="./img/DA_Logo.svg" alt="DA_Logo">
            <p>© 2023 Developer Akademie GmbH </p>
        </div>
    </footer>
</body>

</html>
